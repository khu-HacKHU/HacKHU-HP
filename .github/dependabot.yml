# SCA — 의존성 업데이트 PR. 취약점 알림·보안 업데이트는 저장소 설정에서 켠다 (docs/security/tools.md).
#
# TODO: 스택이 정해지면 ecosystem을 추가한다.
#   frontend → npm (/frontend)
#   backend  → gradle 또는 pip (/backend)
#   infra    → terraform (/infra), docker (Dockerfile 위치)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    target-branch: develop
    commit-message:
      prefix: cicd
    groups:
      actions:
        patterns: ['*']

  # 저장소 루트의 commitlint·husky
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Seoul
    target-branch: develop
    commit-message:
      prefix: chore
    groups:
      tooling:
        patterns: ['*']
