# SCA — 의존성 업데이트 PR. 취약점 알림·보안 업데이트는 저장소 설정에서 켠다 (docs/security/tools.md).
#
# TODO: 스택이 정해지면 ecosystem을 추가한다.
#   frontend → npm (/frontend)
#   infra    → terraform (/infra), docker (Dockerfile 위치)
version: 2
updates:
  # Spring Boot BOM이 대부분의 버전을 관리하므로 Boot 자체와 BOM 밖 라이브러리 위주로 올라온다.
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    target-branch: develop
    commit-message:
      prefix: chore
    groups:
      backend-minor:
        update-types: [minor, patch]

  # 로컬 개발용 PostgreSQL 이미지
  - package-ecosystem: docker-compose
    directory: /backend
    schedule:
      interval: monthly
      timezone: Asia/Seoul
    target-branch: develop
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    target-branch: develop
    commit-message:
      prefix: cicd
    groups:
      actions:
        patterns: ['*']

  # 저장소 루트의 commitlint·husky
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Seoul
    target-branch: develop
    commit-message:
      prefix: chore
    groups:
      tooling:
        patterns: ['*']
