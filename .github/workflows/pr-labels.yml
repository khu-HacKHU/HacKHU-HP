name: PR Labels

# PR 제목의 type(과 scope, 변경 경로)으로 레이블을 자동으로 맞추고, 맞지 않으면 실패한다
# (CONTRIBUTING.md 5절). 사람이 레이블을 붙일 필요는 없다. 잘못 붙이거나 떼면 다음 실행에서 되돌린다.
#
# - GITHUB_TOKEN으로 바꾼 레이블은 새 워크플로를 트리거하지 않으므로 무한 반복되지 않는다.
# - Dependabot PR은 토큰이 읽기 전용이라 레이블을 바꿀 수 없다. dependabot.yml의 labels로 미리 붙인다.
# - pull_request_target은 쓰지 않는다 (docs/security/secure-coding.md 10절).

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7

      # 규칙 자체를 검사한다. type 매핑이 깨지면 그 type의 PR이 전부 막힌다.
      - name: 레이블 규칙 테스트
        run: bash .github/scripts/test-pr-labels.sh

      # 제목은 사용자 입력이라 run에 직접 넣지 않고 환경변수로 넘긴다 (스크립트 주입 방지).
      - name: 붙어야 할 레이블 계산
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > changed-files.txt
          bash .github/scripts/pr-labels.sh expected "$PR_TITLE" < changed-files.txt > expected-labels.txt
          echo "붙어야 할 레이블: $(paste -sd, expected-labels.txt)"

      - name: 레이블 맞추기
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' > current-labels.txt
          bash .github/scripts/pr-labels.sh diff expected-labels.txt current-labels.txt > changes.txt
          if [ ! -s changes.txt ]; then
            echo "레이블이 이미 맞습니다."
            exit 0
          fi
          while IFS= read -r change; do
            label="${change:1}"
            if [ "${change:0:1}" = "+" ]; then
              echo "붙임: $label"
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f "labels[]=$label" > /dev/null \
                || echo "::warning::'$label' 레이블을 붙이지 못했습니다. 다음 단계에서 다시 확인합니다."
            else
              echo "뗌: $label"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$label" > /dev/null \
                || echo "::warning::'$label' 레이블을 떼지 못했습니다. 다음 단계에서 다시 확인합니다."
            fi
          done < changes.txt

      # 맞추기에 실패했으면(Dependabot·포크 PR의 읽기 전용 토큰 등) 여기서 막힌다.
      - name: 레이블 검사
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' > current-labels.txt
          bash .github/scripts/pr-labels.sh diff expected-labels.txt current-labels.txt > changes.txt
          if [ -s changes.txt ]; then
            echo "::error::PR 레이블이 제목과 맞지 않습니다. 붙일 것(+)·뗄 것(-): $(paste -sd' ' changes.txt) (CONTRIBUTING.md 5절)"
            exit 1
          fi
          echo "레이블 확인 완료: $(paste -sd, current-labels.txt)"
