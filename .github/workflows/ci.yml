name: CI

# 바뀐 경로의 잡만 돌린다 (dorny/paths-filter).
#
# 워크플로 단위 `on.paths` 대신 잡 단위 `if`로 거르는 이유: ruleset의 필수 상태 검사는
# 워크플로 자체가 트리거되지 않으면 "대기 중"으로 남아 PR이 영원히 머지되지 않는다.
# 잡 단위로 건너뛰면 skipped는 성공으로 취급된다. 필수 검사로는 마지막 `ci-ok` 하나만 건다.

on:
  pull_request:
    branches: [main, develop, 'release/**']
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
      repo: ${{ steps.filter.outputs.repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            infra:
              - 'infra/**'
            repo:
              - '.github/**'
              - 'package.json'
              - 'package-lock.json'
              - 'commitlint.config.mjs'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 빌드·테스트
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm test
          npm run build

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # spotlessCheck(포매팅)와 테스트를 포함한다. 통합 테스트는 Testcontainers가
      # 러너의 Docker로 PostgreSQL을 직접 띄우므로 services 컨테이너를 두지 않는다.
      - name: 빌드·테스트
        run: ./gradlew build

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tf
        name: Terraform 파일 확인
        run: |
          if find infra -name '*.tf' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::infra/에 Terraform 파일이 아직 없습니다."
          fi
      - if: steps.tf.outputs.present == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      # 원격 백엔드·AWS 자격 증명 없이 문법만 본다. plan은 OIDC 연동 후 별도 워크플로에서 한다.
      - if: steps.tf.outputs.present == 'true'
        name: fmt·validate
        run: |
          terraform fmt -check -recursive infra
          for dir in $(find infra -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  repo:
    needs: changes
    if: needs.changes.outputs.repo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 스크립트 규칙 테스트
        run: |
          bash .github/scripts/test-validate-pr-source.sh
          bash .github/scripts/test-validate-pr-body.sh

  # ruleset 필수 검사는 이 잡 하나만 건다. 건너뛴 잡은 통과, 실패·취소된 잡이 있으면 실패.
  ci-ok:
    if: always()
    needs: [changes, frontend, backend, infra, repo]
    runs-on: ubuntu-latest
    steps:
      - name: 결과 집계
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "잡 결과: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              exit 1
            fi
          done
