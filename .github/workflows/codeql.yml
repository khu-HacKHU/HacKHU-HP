name: CodeQL

# SAST 보조 도구. Semgrep과 달리 데이터 흐름을 따라가므로 두 결과를 비교해 보는 것이 S3 보안 점검 실습이다.
# 결과는 Code scanning 탭에 올라가며 PR을 막지 않는다.

on:
  pull_request:
    branches: [main, develop, 'release/**']
  push:
    branches: [develop, main]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # 빌드 없이 소스만으로 분석한다. 빌드가 필요한 정밀 분석이 필요해지면 autobuild로 바꾼다.
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
