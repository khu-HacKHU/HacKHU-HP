name: Security

# 보안 1라운드 도구 (docs/security/tools.md).
#
#   gitleaks  시크릿   차단 — 한 번 푸시된 시크릿은 되돌릴 수 없다
#   Semgrep   SAST     보고만 — Code scanning 탭에 SARIF로 올린다
#   Checkov   IaC      보고만 — Code scanning 탭에 SARIF로 올린다
#
# 보고만 하는 도구의 차단 기준은 1R 담당자가 결과를 판별한 뒤 정한다.
# 차단으로 바꾸려면 해당 잡의 `|| true`나 `soft_fail`을 지우고 ruleset 필수 검사에 추가한다.

on:
  pull_request:
    branches: [main, develop, 'release/**']
  push:
    branches: [develop, main]
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 09:00 KST — 새로 추가된 규칙으로 기존 코드를 다시 본다
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action은 org 저장소에서 라이선스 키를 요구하므로 공식 이미지를 직접 실행한다.
      # PR은 추가된 커밋만, push·스케줄은 전체 히스토리를 본다.
      - name: 시크릿 스캔
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          args=(git --redact --verbose --config .gitleaks.toml)
          if [ -n "$BASE_SHA" ]; then
            args+=(--log-opts="$BASE_SHA..$HEAD_SHA")
          fi
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 "${args[@]}" .

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@v7
      # 규칙셋 조정은 1R SAST 담당자 몫이다. 프론트엔드가 정해지면 해당 언어 규칙을 추가한다.
      - name: SAST 스캔
        run: |
          semgrep scan --metrics=off \
            --config p/default \
            --config p/owasp-top-ten \
            --config p/github-actions \
            --config p/java \
            --text \
            --sarif-output=semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  checkov:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: IaC 스캔
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,github_actions,dockerfile
          skip_path: practice
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,results.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
          category: checkov
