# 로컬 개발. DB 연결 정보는 compose.yaml에서 spring-boot-docker-compose가 자동으로 채운다.
spring:
  docker:
    compose:
      lifecycle-management: start-only
  jpa:
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    org.hibernate.SQL: debug

# 프론트엔드 개발 서버 (Vite 기본 포트)
app:
  cors:
    allowed-origins: http://localhost:5173
  # JWT_SECRET 없이도 실행되게 실행할 때마다 무작위 키를 만든다. 서버를 다시 시작하면 이전 access 토큰은 401이고
  # 프론트엔드가 refresh로 새 토큰을 받는다. local 밖에서는 켜지 않는다.
  jwt:
    allow-generated-secret: true
