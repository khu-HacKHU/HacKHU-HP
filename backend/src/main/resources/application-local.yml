# 로컬 개발. DB 연결 정보는 compose.yaml에서 spring-boot-docker-compose가 자동으로 채운다.
spring:
  docker:
    compose:
      lifecycle-management: start-only
  jpa:
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    org.hibernate.SQL: debug

# 로컬에는 CloudFront가 없다. 임시 키로 서명하므로 사진 주소는 실제로 열리지 않는다.
# 실제 CloudFront로 확인하려면 GALLERY_CDN_* 환경변수를 넣고 실행한다.
gallery:
  cdn:
    base-url: ${GALLERY_CDN_BASE_URL:https://cdn.local.invalid}
    key-pair-id: ${GALLERY_CDN_KEY_PAIR_ID:LOCAL_KEY_PAIR_ID}
    allow-ephemeral-key: true
