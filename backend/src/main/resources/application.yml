spring:
  application:
    name: hackhu-hp
  profiles:
    default: local
  datasource:
    hikari:
      data-source-properties:
        # PostgreSQL 오류의 Detail(예: "Key (email)=(...) already exists", "Failing row contains (...)")을
        # 예외 메시지와 로그에 싣지 않는다. 행 값에 이메일, 이름, 비밀번호 해시가 들어 있다 (5-1-9, CWE-532).
        # 제약 이름은 메시지 본문에 남으므로 유니크 위반을 409로 바꾸는 처리는 그대로 동작한다.
        logServerErrorDetail: false
  jpa:
    # 스키마는 Flyway 마이그레이션만 바꾼다. Hibernate는 검증만 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # 시각은 UTC로만 주고받는다. 엔티티에 LocalDateTime을 쓰더라도 JVM 기본 시간대에
        # 끌려가지 않게 고정한다 (backend/AGENTS.md "시각 컬럼").
        jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  # 목록 API의 size 상한 (docs/conventions/api.md 2절). 넘으면 100으로 잘린다.
  data:
    web:
      pageable:
        max-page-size: 100

server:
  # 에러 응답에 스택 트레이스·예외 메시지를 싣지 않는다 (docs/conventions/api.md 3절).
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# API 문서는 기본으로 끄고 local에서만 켠다. 새 프로파일이 생겨도 실수로 노출되지 않게 한다.
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
