spring:
  application:
    name: hackhu-hp
  profiles:
    default: local
  jpa:
    # 스키마는 Flyway 마이그레이션만 바꾼다. Hibernate는 검증만 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # 시각은 UTC로만 주고받는다. 엔티티에 LocalDateTime을 쓰더라도 JVM 기본 시간대에
        # 끌려가지 않게 고정한다 (backend/AGENTS.md "시각 컬럼").
        jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  # 목록 API의 size 상한 (docs/conventions/api.md 2절). 넘으면 100으로 잘린다.
  data:
    web:
      pageable:
        max-page-size: 100

server:
  # 에러 응답에 스택 트레이스·예외 메시지를 싣지 않는다 (docs/conventions/api.md 3절).
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false

storage:
  s3:
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# API 문서는 기본으로 끄고 local에서만 켠다. 새 프로파일이 생겨도 실수로 노출되지 않게 한다.
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

# 갤러리 사진 조회 주소 (CloudFront 서명 URL). 값은 환경변수로만 받는다. 비어 있으면 서버가 뜨지 않는다.
gallery:
  cdn:
    base-url: ${GALLERY_CDN_BASE_URL:}
    key-pair-id: ${GALLERY_CDN_KEY_PAIR_ID:}
    private-key: ${GALLERY_CDN_PRIVATE_KEY:}
    url-ttl: 1h
